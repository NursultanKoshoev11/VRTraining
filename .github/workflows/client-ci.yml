name: VR Client CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hosted:
    name: Validate Unreal project on hosted runner
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "Default/Default.uproject")) { throw "Default/Default.uproject was not found." }
          if (!(Test-Path "Default/Source/Default/Default.Build.cs")) { throw "Default.Build.cs was not found." }
          if (Test-Path "VRTraining.uproject") { throw "Root VRTraining.uproject must not exist." }
          if (Test-Path "Source/VRTraining") { throw "Root Source/VRTraining must not exist." }
          Write-Host "Project layout is valid."
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Check Unreal Engine availability
        id: locate_ue
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "C:/Program Files/Epic Games/UE_5.6",
            "D:/Program Files/Epic Games/UE_5.6",
            "F:/Program Files/Epic Games/UE_5.6"
          )
          foreach ($path in $candidates) {
            if (!(Test-Path $path)) {
              Write-Host "Path does not exist: $path"
              continue
            }
            $uat = Join-Path $path "Engine/Build/BatchFiles/RunUAT.bat"
            if (Test-Path $uat) {
              "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "ue_dir=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              Write-Host "Found Unreal Engine at $path"
              exit 0
            }
          }
          "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Unreal Engine 5.6 is not installed on this GitHub-hosted runner."

      - name: Hosted runner result
        shell: pwsh
        run: |
          Write-Host "Client structure validation passed."
          Write-Host "This hosted runner does not package the Unreal client unless UE_5.6 is preinstalled."
