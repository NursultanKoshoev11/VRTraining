name: VR Client CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build-attempt:
    name: Validate Unreal project and attempt hosted build
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "Default/Default.uproject")) { throw "Default/Default.uproject was not found." }
          if (!(Test-Path "Default/Source/Default/Default.Build.cs")) { throw "Default.Build.cs was not found." }
          if (Test-Path "VRTraining.uproject") { throw "Root VRTraining.uproject must not exist." }
          if (Test-Path "Source/VRTraining") { throw "Root Source/VRTraining must not exist." }
          Write-Host "Project layout is valid."
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Locate Unreal Engine 5.6
        id: locate_ue
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "C:/Program Files/Epic Games/UE_5.6",
            "D:/Program Files/Epic Games/UE_5.6",
            "F:/Program Files/Epic Games/UE_5.6"
          )
          foreach ($path in $candidates) {
            if (!(Test-Path $path)) {
              Write-Host "Path does not exist: $path"
              continue
            }
            $uat = Join-Path $path "Engine/Build/BatchFiles/RunUAT.bat"
            if (Test-Path $uat) {
              "ue_dir=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              Write-Host "Found Unreal Engine at $path"
              exit 0
            }
          }
          "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Unreal Engine 5.6 was not found on this GitHub-hosted runner."

      - name: Generate project files
        if: steps.locate_ue.outputs.found == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ue = "${{ steps.locate_ue.outputs.ue_dir }}"
          & "$ue/Engine/Build/BatchFiles/Build.bat" -projectfiles -project="$env:GITHUB_WORKSPACE/Default/Default.uproject" -game -rocket -progress

      - name: Build Win64 Development package
        if: steps.locate_ue.outputs.found == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ue = "${{ steps.locate_ue.outputs.ue_dir }}"
          & "$ue/Engine/Build/BatchFiles/RunUAT.bat" BuildCookRun -project="$env:GITHUB_WORKSPACE/Default/Default.uproject" -noP4 -platform=Win64 -clientconfig=Development -cook -build -stage -pak -archive -archivedirectory="$env:GITHUB_WORKSPACE/Builds/Win64"

      - name: Upload Win64 artifact
        if: steps.locate_ue.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VRTraining-Win64-Development
          path: Builds/Win64
          if-no-files-found: error

      - name: Hosted runner result
        if: steps.locate_ue.outputs.found != 'true'
        shell: pwsh
        run: |
          Write-Host "Client structure validation passed."
          Write-Host "Full Unreal build was skipped because Unreal Engine 5.6 is not installed on this runner."
